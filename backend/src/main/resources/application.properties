# ============================================================
#  application.properties  |  Camada: Configuração do Spring Boot
#  LabShare - configuração do backend
#  Responsável na apresentação: Todos  |  Atividade: Q2 (telas CRUD com banco)
# ------------------------------------------------------------
#  O que faz: configura a porta do backend, a conexão com o PostgreSQL (Neon),
#  a criação automática das tabelas (schema.sql) e dos dados de exemplo (data.sql),
#  o formato das datas no JSON e o log dos SQLs.
#  Quem chama: o Spring Boot lê este arquivo sozinho ao iniciar (LabShareApplication).
#  Chama: db.properties (credenciais), schema.sql e data.sql.
# ============================================================
# Porta HTTP do backend. O frontend (Vite, porta 5173) chama /api e o proxy encaminha para cá.
server.port=8080

# As credenciais do Neon NÃO ficam aqui (este arquivo vai para o GitHub).
# Elas ficam em backend/db.properties (ignorado pelo git).
# Copie db.properties.example para db.properties e preencha.
# "optional:" = se o arquivo não existir, o backend sobe mesmo assim (usa os valores padrão abaixo).
spring.config.import=optional:file:./db.properties,optional:file:./backend/db.properties

# Conexão com o banco. A sintaxe ${DB_URL:valor} significa: use a variável DB_URL
# (vinda do db.properties ou do ambiente); se não existir, use o valor depois dos dois-pontos
# (um PostgreSQL local). O Spring usa isto para criar o JdbcTemplate injetado nos DAOs.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/labshare}
spring.datasource.username=${DB_USER:labshare}
spring.datasource.password=${DB_PASSWORD:labshare}
# Hikari = pool de conexões: mantém até 5 conexões abertas e reaproveita entre requisições
# (abrir uma conexão nova com o Neon a cada SQL seria lento).
spring.datasource.hikari.maximum-pool-size=5

# Ao iniciar, roda schema.sql (CREATE TABLE IF NOT EXISTS) e data.sql (dados de demonstração)
spring.sql.init.mode=always
# UTF-8 para gravar corretamente os acentos dos dados de exemplo ("Eletrônica", "Câmera").
spring.sql.init.encoding=UTF-8

# Datas em JSON no formato 2026-10-16 (e não como número)
spring.jackson.serialization.write-dates-as-timestamps=false
# Fuso horário usado pelo Jackson ao converter datas para JSON (horário de Brasília).
spring.jackson.time-zone=America/Sao_Paulo

# Mostra no console cada SQL executado pelos DAOs (útil na apresentação)
logging.level.br.pucpr.labshare=INFO

# Desliga o "tradutor de exceções" automático do Spring para classes @Repository.
# Ele cria um proxy (cópia) de cada DAO, e o proxy não consegue repassar os métodos
# "final" do AbstractDao (Template Method) -> o método rodava na cópia vazia e dava
# NullPointerException ("this.log is null"). O JdbcTemplate já converte os erros do banco
# em DataAccessException sozinho, então não perdemos nada.
spring.dao.exceptiontranslation.enabled=false
