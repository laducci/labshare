# ============================================================
#  LabShare - configuração do backend
# ============================================================
server.port=8080

# As credenciais do Neon NÃO ficam aqui (este arquivo vai para o GitHub).
# Elas ficam em backend/db.properties (ignorado pelo git).
# Copie db.properties.example para db.properties e preencha.
spring.config.import=optional:file:./db.properties,optional:file:./backend/db.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/labshare}
spring.datasource.username=${DB_USER:labshare}
spring.datasource.password=${DB_PASSWORD:labshare}
spring.datasource.hikari.maximum-pool-size=5

# Ao iniciar, roda schema.sql (CREATE TABLE IF NOT EXISTS) e data.sql (dados de demonstração)
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Datas em JSON no formato 2026-10-16 (e não como número)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo

# Mostra no console cada SQL executado pelos DAOs (útil na apresentação)
logging.level.br.pucpr.labshare=INFO
