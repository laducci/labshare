# ============================================================
#  regras-emprestimo.properties  |  Camada: Configuração (regras de empréstimo)
#  Responsável na apresentação: Todos  |  Atividade: Q1 (Singleton ConfiguracaoEmprestimo)
# ------------------------------------------------------------
#  O que faz: guarda as regras de empréstimo fora do código Java. Para mudar o prazo,
#  a multa ou os textos, basta editar este arquivo (sem recompilar a lógica).
#  Quem chama: lido UMA única vez pelo Singleton ConfiguracaoEmprestimo (getInstance()).
#  Chama: ninguém (é só dados no formato chave=valor).
# ============================================================
# Prazo máximo de uma reserva em dias (validado no ReservaService ao criar a reserva).
prazo.maximo.dias=7
# Valor cobrado por dia de atraso, em reais (usado pela Strategy MultaPorDiaDeAtraso, recurso lateFee).
multa.valor.diario=5.00
# Horário limite de devolução no último dia (aparece nas regras e no lembrete RN12).
horario.devolucao=18:00
# Textos mostrados na tela "Confirmar reserva". Numere em sequência (regra.1, regra.2...):
# o Singleton lê até não encontrar o próximo número.
regra.1=O empréstimo é pessoal e intransferível.
regra.2=A devolução deve ocorrer até às 18:00 do último dia.
regra.3=Danos ou perdas devem ser reportados imediatamente.
regra.4=Renovações dependem de disponibilidade do equipamento.
